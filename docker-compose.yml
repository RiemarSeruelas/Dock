services:
  web:
    build:
      context: .
      target: web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    ports:
      - "${APP_PORT:-5059}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5059}
      DATA_FILE: /app/data/trial-data.json
      UPLOAD_DIR: /app/uploads
      TZ: ${TZ:-Asia/Manila}
    volumes:
      - ./data:/app/data
      - dockflow_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

volumes:
  dockflow_uploads:
