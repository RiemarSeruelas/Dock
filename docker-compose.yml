services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-5059}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-dockflow}:${POSTGRES_PASSWORD:-dockflow}@db:5432/${POSTGRES_DB:-dockflow}
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5059}
      UPLOAD_DIR: /app/uploads
    volumes:
      - dockflow_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dockflow}
      POSTGRES_USER: ${POSTGRES_USER:-dockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dockflow}
      TZ: ${TZ:-Asia/Manila}
    volumes:
      - dockflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dockflow} -d ${POSTGRES_DB:-dockflow}"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped

volumes:
  dockflow_postgres:
  dockflow_uploads:
