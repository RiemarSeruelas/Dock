services:
  web:
    build:
      context: .
      target: web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      WEB_TRUSTED_PROXY_CIDRS: ${WEB_TRUSTED_PROXY_CIDRS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-5059}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-replace-this-access-secret-before-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-replace-this-refresh-secret-before-production}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-dockflow_refresh}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      APP_ORIGIN: ${APP_ORIGIN:-https://dockflow.myvnc.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://dockflow.myvnc.com}
      ALLOW_PRIVATE_NETWORK_ORIGINS: ${ALLOW_PRIVATE_NETWORK_ORIGINS:-false}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-1200}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-20}
      REFRESH_RATE_LIMIT_WINDOW_MS: ${REFRESH_RATE_LIMIT_WINDOW_MS:-900000}
      REFRESH_RATE_LIMIT_MAX: ${REFRESH_RATE_LIMIT_MAX:-60}
      AI_AGENT_WEBHOOK_SECRET: ${AI_AGENT_WEBHOOK_SECRET:-}
      AI_AGENT_WEBHOOK_RATE_LIMIT_WINDOW_MS: ${AI_AGENT_WEBHOOK_RATE_LIMIT_WINDOW_MS:-60000}
      AI_AGENT_WEBHOOK_RATE_LIMIT_MAX: ${AI_AGENT_WEBHOOK_RATE_LIMIT_MAX:-30}
      AI_AGENT_WEBHOOK_MAX_SKEW_SECONDS: ${AI_AGENT_WEBHOOK_MAX_SKEW_SECONDS:-300}
      GEOCODING_API_URL: ${GEOCODING_API_URL:-https://nominatim.openstreetmap.org/search}
      GEOCODING_FALLBACK_API_URL: ${GEOCODING_FALLBACK_API_URL:-https://photon.komoot.io/api/}
      ROUTING_API_URL: ${ROUTING_API_URL:-https://router.project-osrm.org/route/v1/driving}
      FREE_TRAFFIC_ESTIMATE_ENABLED: ${FREE_TRAFFIC_ESTIMATE_ENABLED:-true}
      TRAFFIC_ESTIMATE_BUFFER_MINUTES: ${TRAFFIC_ESTIMATE_BUFFER_MINUTES:-3}
      ETA_USER_AGENT: ${ETA_USER_AGENT:-DockFlow/0.1}
      ETA_API_TIMEOUT_MS: ${ETA_API_TIMEOUT_MS:-10000}
      ETA_RATE_LIMIT_WINDOW_MS: ${ETA_RATE_LIMIT_WINDOW_MS:-900000}
      ETA_RATE_LIMIT_MAX: ${ETA_RATE_LIMIT_MAX:-30}
      LOCATION_ENCRYPTION_KEY: ${LOCATION_ENCRYPTION_KEY:-}
      SAP_STORAGE: ${SAP_STORAGE:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-your_postgres_host}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-docker}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-Analysis}
      POSTGRES_SAP_DRESSINGS_TABLE: ${POSTGRES_SAP_DRESSINGS_TABLE:-SAPAnalysis}
      POSTGRES_SAP_SAVOURY_TABLE: ${POSTGRES_SAP_SAVOURY_TABLE:-SAPAnalysisSavoury}
      POSTGRES_SESSION_LOGS_TABLE: ${POSTGRES_SESSION_LOGS_TABLE:-SAPAnalysis}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      SAP_NETWORK_RESTRICTION_ENABLED: ${SAP_NETWORK_RESTRICTION_ENABLED:-false}
      SAP_ALLOWED_CIDRS: ${SAP_ALLOWED_CIDRS:-}
      SAP_TRUSTED_PROXY_CIDRS: ${SAP_TRUSTED_PROXY_CIDRS:-}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.office365.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-cavitefoods.dockflow@unilever.com}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_STORAGE: postgres
      DB_ENABLED: "true"
      DB_HOST: ${DB_HOST:-/var/run/postgresql}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-Dockflow}
      DB_USER: ${DB_USER:-dockflow_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SCHEMA: ${DB_SCHEMA:-Dockflow}
      DB_SSL: ${DB_SSL:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      POSTGRES_IMPORT_FILE: ${POSTGRES_IMPORT_FILE:-/app/data/trial-data.json}
      UPLOAD_DIR: /app/uploads
      TZ: ${TZ:-Asia/Manila}
    volumes:
      - ./data:/app/data:ro
      - /var/run/postgresql:/var/run/postgresql
      - dockflow_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

volumes:
  dockflow_uploads:
